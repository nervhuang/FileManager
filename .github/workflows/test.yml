name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # windows-latest 而非 ubuntu：這支程式呼叫 Windows shell API（回收筒、
    # 原生右鍵選單），而且要驗的行為就是它在 Windows 上的行為。
    runs-on: windows-latest

    env:
      # runner 的主控台是 cp1252，任何印中文的步驟都會拋 UnicodeEncodeError。
      # 設在 job 層級，之後新增的步驟不必各自記得。
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 行數上限檢查
        run: python scripts/check_line_limits.py

      - name: 測試
        env:
          # Qt 沒有桌面可用；offscreen 量得到 widget 狀態，量不到長相。
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
