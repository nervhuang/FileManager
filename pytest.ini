[pytest]
testpaths = tests
# 測試檔名以規格條文編號開頭（見 docs/spec/README.md），例如
# tests/search/test_srch_14_folder_first_sort.py 對應 docs/spec/search.md 的 SRCH-14。
python_files = test_*.py

markers =
    logic: 純邏輯，不需要 QApplication。快，pre-commit hook 只跑這一類。
    gui: 需要 QApplication（以 offscreen 執行）。量得到 widget 狀態，量不到長相。
    manual: 佔位用，標記無法自動驗證、只能人工驗收的行為。預設不收集。

addopts =
    --strict-markers
    -m "not manual"
    -ra
